syntax = "proto3";

package network_protocol;

// ---------------------------------------------------------
// Core Data Types
// ---------------------------------------------------------

message Data {
  oneof kind {
    bytes byte_stream = 1;
    string string_value = 2;
    int64 s_integer = 3;
    uint64 u_integer = 4;
    ManyData array = 5;
    NullValue null_value = 6;
  }
}

message ManyData {
  repeated Data elements = 1;
}

message NullValue {}

// ---------------------------------------------------------
// Error Types
// ---------------------------------------------------------

// Empty message to represent the data-less variant in SerializationErrorKind
message FormatError {}

// Maps to SerializationErrorKind
// Using a oneof because FieldNotOptional contains data (a string)
message SerializationErrorKind {
  oneof kind {
    string field_not_optional = 1;
    FormatError format_error = 2;
  }
}

// Maps to StorageErrorKind
enum StorageErrorKind {
  STORAGE_ERROR_UNSPECIFIED = 0; // proto3 requires 0 as the default
  STORAGE_ERROR_FIELD_NOT_FOUND = 1;
  STORAGE_ERROR_UNEXPECTED_ERROR = 2;
}

// Maps to NetworkErrorKind
enum NetworkErrorKind {
  NETWORK_ERROR_UNSPECIFIED = 0; // proto3 requires 0 as the default
  NETWORK_ERROR_CONNECTION_FAILED = 1;
  NETWORK_ERROR_BINDING_TO_ADDR_FAILED = 2;
  NETWORK_ERROR_INVALID_REQUEST_TYPE = 3;
  NETWORK_ERROR_FRAME_WRITE_ERROR = 4;
  NETWORK_ERROR_FRAME_READ_ERROR = 5;
}

// Maps to RRErrorKind
message RRErrorKind {
  oneof kind {
    SerializationErrorKind serialization_error = 1;
    StorageErrorKind storage_error = 2;
    NetworkErrorKind network_error = 3;
  }
}

// Maps to RRError struct.
// Named ErrorRequest to match your requested naming convention for the Frame.
message ErrorRequest {
  RRErrorKind kind = 1;
  // The `optional` keyword ensures `prost` generates an Option<String> in Rust
  optional string message = 2;
}

// ---------------------------------------------------------
// Request Variants
// ---------------------------------------------------------

message GetRequest {
  string key = 1;
}

message SetRequest {
  string key = 1;
  Data value = 2;
}

message DataRequest {
  Data value = 1;
  string key = 2;
}

// ---------------------------------------------------------
// The Frame
// ---------------------------------------------------------

message Frame {
  // The core request
  oneof request {
    GetRequest get = 1;
    SetRequest set = 2;
    DataRequest data = 3;
    ErrorRequest error = 4;
  }

  // Additional context
  Data payload = 5;

  // Correlates a response frame with the request that caused it,
  // so clients can route replies (actor pattern).
  // Frames from peers that don't set it decode as 0.
  uint64 request_id = 8;
}